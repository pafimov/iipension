name: ai-pension-starter
x-api: &api
  build: ./backend
  env_file: .env
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run make init-env}
      POSTGRES_USER: ${POSTGRES_USER:?Run make init-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init-env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    restart: "no"
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
