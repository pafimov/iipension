name: Quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: pension, POSTGRES_USER: pension, POSTGRES_PASSWORD: ci-only-not-for-deployment}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pension" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.9", python-version: "3.12"}
      - run: make install
      - run: make check
        env:
          POSTGRES_DB: pension
          POSTGRES_USER: pension
          POSTGRES_PASSWORD: ci-only-not-for-deployment
          POSTGRES_HOST: localhost
          TEST_POSTGRES: "1"
      - name: Audit Python runtime dependencies
        run: |
          uv export --directory backend --frozen --no-dev --format requirements-txt --output-file /tmp/runtime-requirements.txt > /dev/null
          uv tool run pip-audit==2.10.1 --disable-pip --no-deps --requirement /tmp/runtime-requirements.txt
      - run: cd frontend && npm audit --audit-level=high
      - run: make init-env && docker compose up --build --wait
      - name: Create ephemeral browser-test user
        run: |
          echo "E2E_USERNAME=e2e-ci" >> "$GITHUB_ENV"
          E2E_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD="$E2E_PASSWORD" api python manage.py createsuperuser --noinput --username e2e-ci --email e2e@example.invalid
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e
      - if: always()
        run: docker compose down
